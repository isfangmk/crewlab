[project]
name = "ai-workbench"
version = "0.1.0"
description = "AI 工作台后端（FastAPI + Google ADK）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy",
  "asyncpg",
  # SQLite 业务库驱动：开发/无中间件环境用（生产仍是 asyncpg + pgvector）
  "aiosqlite",
  # 触发器 Cron 解析
  "croniter",
  "greenlet",
  "pydantic-settings",
  "httpx",
  "python-multipart",
  "sse-starlette",
  # Redis 强依赖：事件总线、对话流多订阅者、分布式锁与共享状态统一走它
  "redis>=5,<6",
  "google-adk",
  "litellm",
  "pgvector",
  "mcp>=2.3.0",
  "adk-tool-search>=0.3.0",
  "pypdf",
  "python-docx",
  # 沙盒执行：llm-sandbox 负责容器生命周期，docker 是它的 daemon 客户端。
  # 二者缺一，沙盒会在 import 阶段失败并被记成「代码执行失败」，所以必须声明。
  "llm-sandbox[docker]>=0.3.46",
  "docker>=7.2.0",
]

[dependency-groups]
dev = [
  "basedpyright>=1.31.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  # 接口并发压测（perf/locustfile.py）；只有压测时才用，不进运行时依赖
  "locust>=2.31.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/simple/"
default-groups = ["dev"]

[tool.basedpyright]
include = ["app"]
exclude = [
  "**/__pycache__",
  ".venv",
  "perf",
]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "standard"
# 第三方包多数无完整 stub，缺 stub 不挡门；不可达代码与类型错误要报
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportUnreachable = "error"
reportUnusedParameter = "error"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E4/E7/E9 = pycodestyle 可执行性子集（不含 E501 长行）；F = pyflakes；
# I = isort；S = bandit；BLE = blind-except。与代码内已有 # noqa 码一致。
select = ["E4", "E7", "E9", "F", "I", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
# 测试常态不按生产标准报：assert 断言、桩账号密钥常量、容器侧 /tmp 路径
# 字符串、桩服务子进程、清理兜底的 try/except/pass。
"tests/**" = ["S101", "S105", "S106", "S108", "S110", "S603", "S607"]
